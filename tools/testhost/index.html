<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoSoul 测试上位机</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --edge:#2b3444;
    --fg:#d6dee8; --dim:#8b98a8; --accent:#40ff70; --warn:#ffb454; --bad:#ff5c6c;
    --ok:#3fb950; --blue:#58a6ff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-size:13px; }
  h2 { margin:0 0 8px; font-size:13px; color:var(--accent); letter-spacing:.5px; text-transform:uppercase; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 12px;
         background:var(--panel); border-bottom:1px solid var(--edge); position:sticky; top:0; z-index:9; }
  .bar input { background:var(--panel2); border:1px solid var(--edge); color:var(--fg);
               padding:5px 7px; border-radius:5px; font:inherit; }
  #wsurl { width:280px; } #token { width:120px; }
  button { background:var(--panel2); border:1px solid var(--edge); color:var(--fg);
           padding:5px 10px; border-radius:5px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.warn { border-color:var(--warn); color:var(--warn); }
  button.bad { border-color:var(--bad); color:var(--bad); font-weight:bold; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:10px; padding:10px; }
  .panel { background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:10px; }
  .panel.wide { grid-column:1/-1; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td,th { text-align:left; padding:2px 6px; border-bottom:1px solid var(--panel2); }
  th { color:var(--dim); font-weight:normal; }
  .pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; }
  .p-ok{ background:#12331d; color:var(--ok);} .p-bad{ background:#3a1418; color:var(--bad);}
  .p-dim{ background:#22272e; color:var(--dim);} .p-warn{ background:#33280f; color:var(--warn);}
  canvas { width:100%; height:64px; display:block; background:var(--panel2); border-radius:5px; }
  .chrow { display:flex; align-items:center; gap:6px; margin:4px 0; }
  .chrow .lbl { width:66px; color:var(--dim); font-size:11px; }
  .chrow .stat { width:150px; font-size:10px; color:var(--dim); text-align:right; white-space:nowrap; }
  .chrow canvas { flex:1; height:34px; }
  .status { font-size:11px; color:var(--dim); }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--bad); }
  .dot.on { background:var(--ok); }
  #log { height:180px; overflow:auto; background:#0a0d12; border-radius:5px; padding:6px;
         font-size:11px; white-space:pre-wrap; line-height:1.35; }
  .ev-inj { color:var(--blue); } .ev-evt { color:var(--accent); } .ev-err{ color:var(--bad);} .ev-log{ color:var(--dim);}
  .big { font-size:26px; color:var(--accent); font-weight:bold; }
  .kv { display:flex; justify-content:space-between; gap:8px; padding:1px 0; }
  .kv span:first-child { color:var(--dim); }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:4px 0; }
  .row input[type=number]{ width:64px; } .row input[type=range]{ flex:1; min-width:80px; }
  input[type=number],input[type=text]{ background:var(--panel2); border:1px solid var(--edge);
       color:var(--fg); padding:3px 5px; border-radius:4px; font:inherit; }
  .sub { color:var(--dim); font-size:11px; }
  .btnwrap { display:flex; flex-wrap:wrap; gap:4px; }
  .btnwrap button { padding:3px 7px; font-size:11px; }
  fieldset { border:1px solid var(--edge); border-radius:6px; margin:6px 0; padding:6px 8px; }
  legend { color:var(--dim); font-size:11px; padding:0 4px; }
</style>
</head>
<body>
<div class="bar">
  <strong style="color:var(--accent)">NanoSoul 测试台</strong>
  <span class="dot" id="linkdot"></span><span class="status" id="linkstat">未连接</span>
  <input id="wsurl" placeholder="ws://nanosoul.local/ws">
  <input id="token" placeholder="token">
  <button id="btnWs">连 WebSocket</button>
  <button id="btnSerial">连串口 (Chromium)</button>
  <button id="btnDisc">断开</button>
  <button class="bad" id="btnEstop">急停 ESTOP</button>
  <button id="btnClearFault">解除故障</button>
</div>

<div class="grid">
  <!-- reaction observe -->
  <div class="panel">
    <h2>反应观察 (state)</h2>
    <div class="big" id="soul">—</div>
    <div class="kv"><span>emotion</span><span id="emotion">—</span></div>
    <div class="kv"><span>behavior</span><span id="beh">—</span></div>
    <div class="kv"><span>mood E / S</span><span id="mood">—</span></div>
    <div class="kv"><span>duty</span><span id="duty">—</span></div>
    <div class="kv"><span>face</span><span id="facest">—</span></div>
    <div class="kv"><span>net</span><span id="net">—</span></div>
    <div class="kv"><span>llm / voice</span><span id="lv">—</span></div>
    <div class="kv"><span>heap</span><span id="heap">—</span></div>
  </div>

  <!-- hwinfo -->
  <div class="panel">
    <h2>硬件清单 (hwinfo)</h2>
    <div class="row"><button id="btnHw">刷新 hwinfo</button><span class="sub" id="fwline"></span></div>
    <table id="hwtab"><tbody></tbody></table>
    <div class="sub" id="scanline"></div>
    <div class="sub" id="pinline"></div>
    <div class="sub" id="rangeline"></div>
  </div>

  <!-- inject -->
  <div class="panel">
    <h2>刺激注入</h2>
    <div class="row">
      <span class="sub">sense 速率</span>
      <button data-hz="0">关</button><button data-hz="10">10</button>
      <button data-hz="20">20</button><button data-hz="50">50Hz</button>
    </div>
    <fieldset><legend>override 通道</legend><div id="ovbox"></div></fieldset>
    <fieldset><legend>事件直注 inject_event</legend>
      <div class="btnwrap" id="evbtns"></div>
    </fieldset>
  </div>

  <!-- motor -->
  <div class="panel">
    <h2>电机测试</h2>
    <div class="row">
      <span class="sub">M</span><input type="number" id="mtM" value="0" min="0" max="2">
      <span class="sub">duty</span><input type="number" id="mtDuty" value="400" min="-1023" max="1023">
      <span class="sub">ms</span><input type="number" id="mtMs" value="500" min="100" max="5000">
      <button id="btnMotor">RUN</button>
      <button class="bad" id="btnMotorStop">全停</button>
    </div>
    <fieldset><legend>teleop 点动 (需 motion.enabled)</legend>
      <div class="btnwrap">
        <button data-tel="fwd">前 ↑</button><button data-tel="back">后 ↓</button>
        <button data-tel="left">左 ←</button><button data-tel="right">右 →</button>
        <button data-tel="cw">转 ↻</button><button data-tel="ccw">转 ↺</button>
      </div>
    </fieldset>
    <div class="kv"><span>enc count</span><span id="enccnt">—</span></div>
    <div class="kv"><span>enc rpm</span><span id="encrpm">—</span></div>
  </div>

  <!-- charts -->
  <div class="panel wide">
    <h2>实时曲线 & 量程 (sense)</h2>
    <div class="row">
      <button id="btnResetStats">复位统计</button>
      <button id="btnExportJson">导出量程 JSON</button>
      <button id="btnExportCsv">导出量程 CSV</button>
      <span class="sub" id="senserate">sense: 关</span>
      <span class="sub" id="seqline"></span>
    </div>
    <div id="charts"></div>
  </div>

  <!-- scenarios -->
  <div class="panel">
    <h2>场景脚本 (注入→反应)</h2>
    <div class="btnwrap" id="scenbtns"></div>
    <table id="scentab"><tbody></tbody></table>
  </div>

  <!-- selftest -->
  <div class="panel">
    <h2>自检矩阵</h2>
    <div class="row"><button id="btnSelftest">跑一轮 selftest</button><span class="sub" id="stround"></span></div>
    <table id="sttab"><tbody></tbody></table>
  </div>

  <!-- log -->
  <div class="panel wide">
    <h2>事件 / 日志时间轴</h2>
    <div class="row"><button id="btnClearLog">清空</button>
      <button id="btnSnap">快照 (WS)</button>
      <img id="snapimg" style="max-height:60px;border-radius:4px;display:none">
    </div>
    <div id="log"></div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const now = () => performance.now();
const clamp = (x,a,b)=>x<a?a:(x>b?b:x);

/* ---------------- transport abstraction ---------------- */
const Link = {
  ws:null, serial:null, reader:null, writer:null, kind:null,
  nextId:1, pending:new Map(), buf:"",
  onframe:null, onbinary:null,

  setStatus(on, txt){ $("#linkdot").classList.toggle("on",on); $("#linkstat").textContent=txt; },

  async connectWs(url){
    this.disconnect();
    return new Promise((res,rej)=>{
      let ws;
      try { ws=new WebSocket(url); } catch(e){ return rej(e); }
      ws.binaryType="blob";
      ws.onopen=()=>{ this.ws=ws; this.kind="ws"; this.setStatus(true,"WS "+url); logLine("log","已连接 "+url); res(); };
      ws.onerror=e=>{ rej(e); };
      ws.onclose=()=>{ if(this.kind==="ws"){ this.setStatus(false,"WS 已关闭"); this.kind=null; } };
      ws.onmessage=ev=>{
        if(typeof ev.data==="string") this._line(ev.data);
        else if(this.onbinary) this.onbinary(ev.data);
      };
    });
  },

  async connectSerial(){
    if(!("serial" in navigator)){ alert("此浏览器不支持 WebSerial（用 Chrome/Edge）"); return; }
    this.disconnect();
    const port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    // CH343/CP210x 自动复位板：DTR/RTS 接在 ESP EN/boot 上，open() 会把板子按在
    // 复位里（屏黑、不启动）。开口后立刻释放，让它正常跑。
    try { await port.setSignals({dataTerminalReady:false, requestToSend:false}); } catch(e){}
    this.serial=port; this.kind="serial";
    this.writer=port.writable.getWriter();
    this.setStatus(true,"串口 USB-Serial-JTAG");
    logLine("log","串口已连接");
    this._readLoop(port);
  },

  async _readLoop(port){
    const dec=new TextDecoder();
    this.reader=port.readable.getReader();
    try{
      while(true){
        const {value,done}=await this.reader.read();
        if(done) break;
        this.buf+=dec.decode(value,{stream:true});
        let i;
        while((i=this.buf.indexOf("\n"))>=0){
          const line=this.buf.slice(0,i).trim(); this.buf=this.buf.slice(i+1);
          if(line) this._line(line);
        }
      }
    }catch(e){ logLine("err","串口读出错: "+e); }
    this.setStatus(false,"串口已关闭"); this.kind=null;
  },

  _line(s){
    s=s.trim();
    if(s[0]!=="{"){ logLine("log",s); return; }   // stray log line
    let m; try{ m=JSON.parse(s); }catch(e){ logLine("log",s); return; }
    if(m.type==="ack" && this.pending.has(m.id)){ this.pending.get(m.id)(m); this.pending.delete(m.id); }
    if(this.onframe) this.onframe(m);
  },

  send(obj){
    const id=this.nextId++; obj.v=1; obj.id=id;
    const s=JSON.stringify(obj);
    if(this.kind==="ws" && this.ws?.readyState===1) this.ws.send(s);
    else if(this.kind==="serial" && this.writer) this.writer.write(new TextEncoder().encode(s+"\n"));
    else { logLine("err","未连接，丢弃 "+obj.type); return Promise.reject("no link"); }
    return new Promise(res=>{ this.pending.set(id,res); setTimeout(()=>{ if(this.pending.delete(id)) res({ok:false,err:"timeout"}); },5000); });
  },

  disconnect(){
    try{ this.ws?.close(); }catch(e){}
    try{ this.reader?.cancel(); }catch(e){}
    try{ this.writer?.releaseLock(); }catch(e){}
    try{ this.serial?.close(); }catch(e){}
    this.ws=this.serial=this.reader=this.writer=null; this.kind=null;
    this.setStatus(false,"未连接");
  }
};

/* ---------------- log / timeline ---------------- */
function logLine(cls, txt){
  const el=$("#log"); const t=new Date().toLocaleTimeString();
  const div=document.createElement("div");
  div.className="ev-"+(cls==="err"?"err":cls==="inj"?"inj":cls==="evt"?"evt":"log");
  div.textContent=`[${t}] ${txt}`;
  el.appendChild(div); el.scrollTop=el.scrollHeight;
  while(el.childNodes.length>400) el.removeChild(el.firstChild);
}

/* ---------------- strip chart + running stats ---------------- */
class Chart {
  constructor(label, color, opts={}){
    this.label=label; this.color=color; this.log=opts.log||false; this.unit=opts.unit||"";
    this.N=600; this.data=new Float32Array(this.N); this.head=0; this.filled=0;
    this.resetStats();
    const row=document.createElement("div"); row.className="chrow";
    row.innerHTML=`<span class="lbl">${label}</span><canvas></canvas><span class="stat"></span>`;
    this.canvas=row.querySelector("canvas"); this.statEl=row.querySelector(".stat");
    $("#charts").appendChild(row);
  }
  resetStats(){ this.n=0; this.sum=0; this.sumsq=0; this.min=Infinity; this.max=-Infinity; }
  push(v){
    if(!isFinite(v)) return;
    this.data[this.head]=v; this.head=(this.head+1)%this.N; if(this.filled<this.N) this.filled++;
    this.n++; this.sum+=v; this.sumsq+=v*v; if(v<this.min)this.min=v; if(v>this.max)this.max=v;
  }
  draw(){
    const c=this.canvas, ctx=c.getContext("2d");
    const w=c.width=c.clientWidth, h=c.height=c.clientHeight;
    ctx.clearRect(0,0,w,h);
    if(this.filled<2){ return; }
    let lo=this.min, hi=this.max; if(lo===hi){ lo-=1; hi+=1; }
    const map=v=>{ if(this.log){ const l=Math.log10(Math.max(v,0.1)); const ll=Math.log10(Math.max(lo,0.1)),hh=Math.log10(Math.max(hi,0.1)); return h-2-(l-ll)/(hh-ll||1)*(h-4);} return h-2-(v-lo)/(hi-lo)*(h-4); };
    ctx.strokeStyle=this.color; ctx.lineWidth=1; ctx.beginPath();
    for(let i=0;i<this.filled;i++){
      const idx=(this.head-this.filled+i+this.N)%this.N;
      const x=i/(this.filled-1)*w, y=map(this.data[idx]);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
    const mean=this.n?this.sum/this.n:0;
    const sd=this.n?Math.sqrt(Math.max(0,this.sumsq/this.n-mean*mean)):0;
    const f=x=>Math.abs(x)>=1000?x.toFixed(0):x.toFixed(2);
    this.statEl.textContent = this.n? `${f(this.min)}~${f(this.max)} μ${f(mean)} σ${f(sd)}` : "—";
  }
  stats(){ const mean=this.n?this.sum/this.n:0; const sd=this.n?Math.sqrt(Math.max(0,this.sumsq/this.n-mean*mean)):0;
    return {label:this.label,unit:this.unit,n:this.n,min:this.n?this.min:null,max:this.n?this.max:null,mean,sd}; }
}
const charts={};
["ax","ay","az"].forEach((k,i)=>charts[k]=new Chart(k,["#ff6b6b","#6bff9e","#6ba8ff"][i],{unit:"m/s²"}));
charts.lux=new Chart("lux","#ffd93b",{log:true,unit:"lx"});
charts.cur=new Chart("cur_ma","#ff9f43",{unit:"mA"});
["r0","r1","r2"].forEach((k,i)=>charts[k]=new Chart(k,["#4dd0e1","#4db6ac","#4db6e1"][i],{unit:"rpm"}));
["d0","d1","d2"].forEach((k,i)=>charts[k]=new Chart(k,["#b388ff","#9575cd","#7e57c2"][i],{unit:"duty"}));
setInterval(()=>{ for(const k in charts) charts[k].draw(); }, 100);

/* ---------------- frame router ---------------- */
Link.onframe=m=>{
  if(m.type==="state") onState(m);
  else if(m.type==="event") onEvent(m);
  else if(m.type==="sense") onSense(m);
  else if(m.type==="hwinfo") onHwinfo(m);
};
Link.onbinary=blob=>{
  const url=URL.createObjectURL(blob); const img=$("#snapimg");
  img.src=url; img.style.display="inline"; logLine("evt","收到 JPEG 快照 "+blob.size+"B");
};

let lastSoul=null;
function onState(m){
  $("#soul").textContent=m.soul||"—";
  if(m.soul && m.soul!==lastSoul){ scenarioObserve("soul",m.soul); lastSoul=m.soul; }
  $("#emotion").textContent=m.emotion||"—";
  $("#beh").textContent=m.beh||"—";
  $("#mood").textContent=m.mood?`${m.mood.energy?.toFixed(2)} / ${m.mood.social?.toFixed(2)}`:"—";
  $("#duty").textContent=m.motion?`[${m.motion.duty}] ${m.motion.enabled?"驱动":"仅算"}`:"—";
  $("#facest").textContent=m.face?`p${m.face.present?1:0} x${(m.face.cx||0).toFixed(2)} y${(m.face.cy||0).toFixed(2)}`:"—";
  $("#net").textContent=m.net?.ip?`${m.net.ip} ${m.net.rssi}dB`:"离线";
  $("#lv").textContent=`${m.llm||"—"} / ${m.voice||"—"}`;
  $("#heap").textContent=m.heap?(m.heap/1024|0)+"k":"—";
  if(m.enc_rpm) $("#encrpm").textContent="["+m.enc_rpm.join(", ")+"]";
}

function onEvent(m){
  logLine("evt",`event ${m.name} ${m.data&&Object.keys(m.data).length?JSON.stringify(m.data):""}`);
  scenarioObserve("event",m.name);
  if(m.name==="selftest_item" && m.data) selftestItem(m.data);
}

function onSense(m){
  if(m.accel){ charts.ax.push(m.accel[0]); charts.ay.push(m.accel[1]); charts.az.push(m.accel[2]); }
  if(typeof m.lux==="number") charts.lux.push(m.lux);
  if(typeof m.cur_ma==="number") charts.cur.push(m.cur_ma);
  if(m.enc){ for(let i=0;i<3;i++) charts["r"+i].push(m.enc[i][1]); $("#enccnt").textContent="["+m.enc.map(e=>e[0]).join(", ")+"]"; }
  if(m.duty){ for(let i=0;i<3;i++) charts["d"+i].push(m.duty[i]); }
  $("#seqline").textContent="seq "+m.seq+"  ovr 0x"+(m.ovr||0).toString(16);
}

/* ---------------- hwinfo ---------------- */
const ADDR=a=>"0x"+a.toString(16).toUpperCase().padStart(2,"0");
function onHwinfo(m){
  if(m.fw) $("#fwline").textContent=`fw ${m.fw.ver} · ${m.fw.idf} · ${m.fw.mode||"?"}`;
  const tb=$("#hwtab").querySelector("tbody"); tb.innerHTML="";
  (m.i2c1?.expect||[]).forEach(e=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${ADDR(e.addr)}</td><td>${e.name}</td>
      <td><span class="pill ${e.present?"p-ok":"p-bad"}">${e.present?"present":"absent"}</span></td>
      <td class="sub">${e.whoami!=null?"WAI "+ADDR(e.whoami):""} ${e.note||""}</td>`;
    tb.appendChild(tr);
  });
  const s1=(m.i2c1?.scan||[]).map(ADDR).join(" ");
  const s0=(m.i2c0?.scan||[]).map(ADDR).join(" ");
  $("#scanline").textContent=`I²C1[${m.i2c1?.pins}]: ${s1}   I²C0[${m.i2c0?.pins}]: ${s0}`;
  if(m.pins?.motors) $("#pinline").textContent="电机引脚 "+m.pins.motors.map(x=>`M${x.m}(pwm${x.pwm}/enc${x.enc_a},${x.enc_b}/stby${x.stby})`).join("  ")+`  strap=IO${m.pins.strap_test}`;
  if(m.range) $("#rangeline").textContent=`量程 lux ${m.range.lux?.join("~")} · ±${m.range.accel_g}g · ${m.range.current_a_fs}A · cpr${m.range.enc_cpr_motor} gear${m.range.gear} · stall ${m.range.stall_ma}mA`;
}

/* ---------------- override channels ---------------- */
const OVR=[
  {ch:"lux",n:1,presets:{"暗":[0],"室内":[300],"强光":[2000]}},
  {ch:"accel",n:3,presets:{"静止":[0,0,9.81],"倒置":[0,0,-9.81],"左翻":[9.81,0,0],"右翻":[-9.81,0,0],"失重":[0,0,0]}},
  {ch:"current_a",n:1,presets:{"零":[0],"堵转0.6A":[0.6],"满1.2A":[1.2]}},
  {ch:"enc_rpm",n:3,presets:{"停":[0,0,0],"转":[60,60,60]}},
  {ch:"face",n:5,presets:{"无":[0,0,0,0,0],"正脸":[1,0,0,0.09,0.8],"偏左":[1,-0.5,0,0.06,0.4]}},
];
function buildOverrides(){
  const box=$("#ovbox"); box.innerHTML="";
  OVR.forEach(o=>{
    const div=document.createElement("div"); div.className="row";
    const presets=Object.entries(o.presets).map(([k,v])=>`<button data-ch="${o.ch}" data-v="${v.join(',')}">${k}</button>`).join("");
    div.innerHTML=`<span class="lbl" style="width:70px">${o.ch}</span>
      <input type="text" id="ov_${o.ch}" placeholder="${Array(o.n).fill(0).join(',')}" style="width:120px">
      <input type="number" id="ovttl_${o.ch}" value="0" title="ttl_ms 0=常驻" style="width:60px">
      <button data-set="${o.ch}">set</button><button data-clr="${o.ch}">clr</button>
      <span class="btnwrap">${presets}</span>`;
    box.appendChild(div);
  });
}
function buildEventBtns(){
  const names=["tap","tap2","lifted","placed","dark","bright","touch","touch_long","loud","wheel_moved","wake","face_present","face_lost","gazed","stall","fault"];
  $("#evbtns").innerHTML=names.map(n=>`<button data-ev="${n}">${n}</button>`).join("");
}

/* ---------------- selftest matrix ---------------- */
const stRows={};
function selftestItem(d){
  let tr=stRows[d.name];
  if(!tr){ tr=document.createElement("tr"); stRows[d.name]=tr; $("#sttab").querySelector("tbody").appendChild(tr); }
  const res=["PASS","FAIL","SKIP"][d.result]||d.result;
  const cls=d.result===0?"p-ok":d.result===1?"p-bad":"p-dim";
  tr.innerHTML=`<td>${d.name}</td><td><span class="pill ${cls}">${res}</span></td><td class="sub">${d.detail||""}</td>`;
  $("#stround").textContent="round "+d.round;
}

/* ---------------- scenario runner ---------------- */
const SCEN=[
  {name:"遮暗→DOZE", steps:[{c:{type:"override_set",ch:"lux",v:0,ttl_ms:20000}}],
   expect:{event:"dark",soul:"DOZE"}, cleanup:[{type:"override_clear",ch:"lux"}], within:18000},
  {name:"敲击→tap", steps:[{c:{type:"override_set",ch:"accel",v:[0,0,18],ttl_ms:80}}],
   expect:{event:"tap"}, within:2000},
  {name:"堵转→FAULT", steps:[
     {c:{type:"teleop",vx:0.3,vy:0,wz:0,ttl_ms:8000}},
     {c:{type:"override_set",ch:"current_a",v:0.6,ttl_ms:8000}},
     {c:{type:"override_set",ch:"enc_rpm",v:[0,0,0],ttl_ms:8000}}],
   expect:{event:"stall",soul:"FAULT"},
   cleanup:[{type:"override_clear",ch:"*"},{type:"clear_fault"}], within:6000},
  {name:"抬起→LIFTED", steps:[{c:{type:"inject_event",name:"lifted"}}],
   expect:{soul:"LIFTED"}, cleanup:[{type:"inject_event",name:"placed"}], within:3000},
  {name:"人脸→离开IDLE", steps:[{c:{type:"override_set",ch:"face",v:[1,0,0,0.09,0.8],ttl_ms:8000}}],
   expect:{soulNot:"IDLE"}, cleanup:[{type:"override_clear",ch:"face"}], within:5000},
];
let scen=null;
function buildScenBtns(){
  $("#scenbtns").innerHTML=SCEN.map((s,i)=>`<button data-scen="${i}">${s.name}</button>`).join("")+`<button data-scen="all">▶ 全跑</button>`;
  const tb=$("#scentab").querySelector("tbody"); tb.innerHTML="";
  SCEN.forEach((s,i)=>{ const tr=document.createElement("tr"); tr.id="scen"+i;
    tr.innerHTML=`<td>${s.name}</td><td><span class="pill p-dim">待运行</span></td>`; tb.appendChild(tr); });
}
function scenSet(i,cls,txt){ $("#scen"+i).children[1].innerHTML=`<span class="pill ${cls}">${txt}</span>`; }
async function runScenario(i){
  const s=SCEN[i]; scen={i,got:{},done:false};
  scenSet(i,"p-warn","运行中");
  for(const st of s.steps){ await Link.send({...st.c}); logLine("inj","场景步 "+JSON.stringify(st.c)); await sleep(150); }
  const t0=now();
  while(now()-t0<s.within){
    if(checkExpect(s.expect,scen.got)){ scenSet(i,"p-ok","PASS"); break; }
    await sleep(100);
  }
  if(!checkExpect(s.expect,scen.got)) scenSet(i,"p-bad","超时");
  scen.done=true;
  for(const c of (s.cleanup||[])){ await Link.send({...c}); }
}
function checkExpect(e,got){
  if(e.event && !got["event:"+e.event]) return false;
  if(e.soul && got.soul!==e.soul) return false;
  if(e.soulNot && (!got.soul || got.soul===e.soulNot)) return false;
  return true;
}
function scenarioObserve(kind,val){
  if(!scen||scen.done) return;
  if(kind==="event") scen.got["event:"+val]=true;
  if(kind==="soul") scen.got.soul=val;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- range export ---------------- */
function collectStats(){ return Object.values(charts).map(c=>c.stats()); }
function download(name,text,type){ const b=new Blob([text],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; a.click(); }

/* ---------------- wire up UI ---------------- */
$("#wsurl").value=localStorage.getItem("wsurl")||"ws://nanosoul.local/ws";
$("#token").value=localStorage.getItem("token")||"";
function wsFull(){ let u=$("#wsurl").value.trim(); const t=$("#token").value.trim();
  localStorage.setItem("wsurl",u); localStorage.setItem("token",t);
  if(t) u+=(u.includes("?")?"&":"?")+"token="+encodeURIComponent(t); return u; }

$("#btnWs").onclick=()=>Link.connectWs(wsFull()).then(()=>Link.send({type:"hwinfo_get"})).catch(e=>logLine("err","连接失败 "+e));
$("#btnSerial").onclick=()=>Link.connectSerial().then(()=>Link.send({type:"hwinfo_get"}));
$("#btnDisc").onclick=()=>Link.disconnect();
$("#btnEstop").onclick=()=>{ Link.send({type:"estop"}); Link.send({type:"motor_stop"}); logLine("inj","ESTOP"); };
$("#btnClearFault").onclick=()=>Link.send({type:"clear_fault"});
$("#btnHw").onclick=()=>Link.send({type:"hwinfo_get"});
$("#btnSelftest").onclick=()=>{ Link.send({type:"selftest"}); logLine("inj","selftest"); };
$("#btnSnap").onclick=()=>Link.send({type:"get_snapshot"});
$("#btnClearLog").onclick=()=>$("#log").innerHTML="";
$("#btnResetStats").onclick=()=>{ Object.values(charts).forEach(c=>c.resetStats()); logLine("log","统计已复位"); };
$("#btnExportJson").onclick=()=>download("nanosoul_range.json",JSON.stringify(collectStats(),null,2),"application/json");
$("#btnExportCsv").onclick=()=>{ const rows=[["channel","unit","n","min","max","mean","sd"]];
  collectStats().forEach(s=>rows.push([s.label,s.unit,s.n,s.min,s.max,s.mean?.toFixed(4),s.sd?.toFixed(4)]));
  download("nanosoul_range.csv",rows.map(r=>r.join(",")).join("\n"),"text/csv"); };

document.querySelectorAll("[data-hz]").forEach(b=>b.onclick=()=>{
  Link.send({type:"sense_rate",hz:+b.dataset.hz}); $("#senserate").textContent="sense: "+(+b.dataset.hz?b.dataset.hz+"Hz":"关"); });

$("#btnMotor").onclick=()=>Link.send({type:"motor_test",m:+$("#mtM").value,duty:+$("#mtDuty").value,ms:+$("#mtMs").value})
  .then(a=>logLine(a.ok?"inj":"err","motor_test "+(a.ok?"ok":a.err)));
$("#btnMotorStop").onclick=()=>Link.send({type:"motor_stop"});
const TEL={fwd:[0.4,0,0],back:[-0.4,0,0],left:[0,0.4,0],right:[0,-0.4,0],cw:[0,0,-0.5],ccw:[0,0,0.5]};
document.querySelectorAll("[data-tel]").forEach(b=>b.onclick=()=>{ const v=TEL[b.dataset.tel];
  Link.send({type:"teleop",vx:v[0],vy:v[1],wz:v[2],ttl_ms:600}); });

document.querySelectorAll("[data-scen]").forEach(b=>b.onclick=async()=>{
  if(b.dataset.scen==="all"){ for(let i=0;i<SCEN.length;i++){ await runScenario(i); await sleep(500); } }
  else runScenario(+b.dataset.scen); });

// delegated handlers for dynamically-built override/event buttons
$("#ovbox").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.set){ const ch=b.dataset.set; const raw=$("#ov_"+ch).value.trim();
    const arr=raw.split(",").map(Number).filter(x=>!isNaN(x));
    const v=arr.length===1?arr[0]:arr; const ttl=+$("#ovttl_"+ch).value||0;
    Link.send({type:"override_set",ch,v,ttl_ms:ttl}).then(a=>logLine(a.ok?"inj":"err",`override ${ch}=${raw} ${a.ok?"":a.err}`)); }
  else if(b.dataset.clr){ Link.send({type:"override_clear",ch:b.dataset.clr}); logLine("inj","clear "+b.dataset.clr); }
  else if(b.dataset.ch){ const ch=b.dataset.ch; $("#ov_"+ch).value=b.dataset.v;
    const arr=b.dataset.v.split(",").map(Number); const v=arr.length===1?arr[0]:arr;
    Link.send({type:"override_set",ch,v,ttl_ms:+$("#ovttl_"+ch).value||0}); logLine("inj",`override ${ch}=${b.dataset.v}`); }
});
$("#evbtns").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  Link.send({type:"inject_event",name:b.dataset.ev}).then(a=>logLine(a.ok?"inj":"err","inject "+b.dataset.ev+(a.ok?"":" "+a.err))); });

buildOverrides(); buildEventBtns(); buildScenBtns();
logLine("log","就绪。连接 WebSocket 或串口后开始。WebSerial 仅 Chromium 系。");
</script>
</body>
</html>
