## main 组件直接依赖（整机固件，ESP-IDF 5.5.2 实测可用）。
## 其余组件级依赖在各 components/*/idf_component.yml（vision/audio/netlink/voice…）。
dependencies:
  idf:
    version: ">=5.5.0"
  espressif/esp_lcd_st7701: "^2.0.0"   # ST7701S MIPI-DSI 面板驱动
  lvgl/lvgl: "9.2.2"                    # TESTPANEL 模式的状态文字渲染
  espressif/pid_ctrl: "^0.2.0"          # 官方 PID 块，轮速闭环用（docs/14）
